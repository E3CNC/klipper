# E3CNC macros — motion, spindle, and job control.
# WCS zeroing and coordinate system selection live in wcs_macros.cfg.


[gcode_macro USE_POSITION_ABSOLUTE]
gcode:
  G90
  RESPOND PREFIX="info" MSG="Absolut position enabled"

[gcode_macro USE_POSITION_RELATIVE]
gcode:
  G91
  RESPOND PREFIX="info" MSG="Relative position enabled"

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  G1 Z5 F6000    ; Lift Z axis
  M5             ; TURN off drill
  CANCEL_PRINT_BASE

[gcode_macro START_PRINT]
gcode:
  WCS_STATUS    ; Show active WCS before job starts
  G90           ; Use absolut position
  G1 Z5 F6000   ; Lift Z
  G1 X0 Y0 F6000; Go to 0, 0 position
  SPINDLE_POWER_ON ; Turn spindle power supply on
  G4 P2000      ; Wait 2.0 seconds before starting the job

[gcode_macro END_PRINT]
gcode:
  G1 Z5 F6000    ; Lift Z axis
  SPINDLE_POWER_OFF ; Turn spindle power off
  M5             ; Turn spindle off RPM control
  G1 X0 Y0 F6000 ; Go to 0,0 position

[gcode_macro SPINDLE_POWER_ON]
gcode:
  SET_PIN PIN=spindle_power VALUE=1

[gcode_macro SPINDLE_POWER_OFF]
gcode:
  SET_PIN PIN=spindle_power VALUE=0

[gcode_macro M3]
description: Start spindle clockwise
gcode:
  {% set s_val = params.S | default(0) | int %}
  {% if s_val > 0 %}
    SET_PIN PIN=spindle_rpm_control VALUE={s_val}
  {% else %}
    SET_PIN PIN=spindle_rpm_control VALUE=0
  {% endif %}

; Turn spindle off
[gcode_macro M5]
gcode:
  M3 S=0

